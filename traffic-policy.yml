on_http_request:
  - expressions:
      - "req.method == 'OPTIONS'"
    actions:
      - type: "custom-response"
        config:
          status_code: 200
          headers:
            access-control-allow-origin: "*"
            access-control-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, HEAD"
            access-control-allow-headers: "*"
            access-control-max-age: "86400"
